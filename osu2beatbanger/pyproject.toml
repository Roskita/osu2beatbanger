[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osu2beatbanger"
version = "0.1.0"
description = "Convert osu!mania 4K maps to Beat Banger Release-format mods."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
osu2beatbanger = "osu2beatbanger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

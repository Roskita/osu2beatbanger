<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beat Banger Mania</title>
<meta name="description" content="Convert .osz to and from Beat Banger valid .zip">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>

  <section class="hero wrap">
    
    <h1><span class="hl-bb">Beat Banger</span><span class="hero-arrow">↔</span><span class="hl-osu">osu!mania</span></h1>
  </section>

  <section class="wrap converter-section" id="converter">
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-label="Choose or drop a file to convert">
      <input type="file" id="fileInput" accept=".osz,.zip" hidden>
      <div class="dz-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <path d="M20 4v20m0 0-7-7m7 7 7-7" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6 27v5a4 4 0 0 0 4 4h20a4 4 0 0 0 4-4v-5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="dz-title"><strong>Upload</strong> osu!mania beatmap (.osz) / Beat Banger mod (.zip)</p>
    </div>

    <div id="statusArea" class="status-area" hidden></div>
    <div id="optionsArea" class="options-area" hidden></div>
    <div id="resultsArea" class="results-area" hidden></div>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
</body>
</html>
